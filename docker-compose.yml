services:
  dyndns_proxy_im:
    container_name: dyndns_proxy
    image: amazoncorretto:8-alpine
    working_dir: /usr/APP/
#    ports:
#      - "4080:80"
#      - "4443:443"
#    expose:
#      - 443
#      - 80
    volumes:
      - ./proxy_files/:/var/APP/
      - ./home/:/usr/APP/
    environment:
      - CONFIG_PATH=/var/APP/proxy.conf
      - LOG_PATH=/var/APP/dyndnsproxy.log
    command: [ "java", "-jar", "/usr/APP/DyndnsV2_Cloudflare_Proxy.jar", "Main" ]
    restart: unless-stopped
